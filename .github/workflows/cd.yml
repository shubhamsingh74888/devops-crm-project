on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main
  # Uncomment the above when a real Twenty server is deployed and secrets are configured

permissions:
  contents: read

env:
  TWENTY_DEPLOY_URL: ${{ secrets.TWENTY_DEPLOY_URL }}

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-and-install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Check server URL is configured
        run: |
          if [ -z "${{ secrets.TWENTY_DEPLOY_URL }}" ]; then
            echo "❌ TWENTY_DEPLOY_URL secret is not set."
            echo "Go to: Settings → Secrets and variables → Actions → New repository secret"
            echo "Add TWENTY_DEPLOY_URL = https://your-twenty-server.com"
            exit 1
          fi
          echo "✅ Deploying to: ${{ secrets.TWENTY_DEPLOY_URL }}"

      - name: Deploy
        uses: twentyhq/twenty/.github/actions/deploy-twenty-app@main
        with:
          api-url: ${{ secrets.TWENTY_DEPLOY_URL }}
          api-key: ${{ secrets.TWENTY_DEPLOY_API_KEY }}

      - name: Install
        uses: twentyhq/twenty/.github/actions/install-twenty-app@main
        with:
          api-url: ${{ secrets.TWENTY_DEPLOY_URL }}
          api-key: ${{ secrets.TWENTY_DEPLOY_API_KEY }}

